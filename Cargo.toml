[package]
name = "radio-video-merger"
version = "0.4.0"
edition = "2021"
description = "Ghép audio radio vào video, tắt tiếng video gốc, tự lặp video nếu ngắn hơn audio"
license = "MIT"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
# Crate đi kèm chính thức của tokio: dùng ReaderStream để trả file mp4 dạng
# stream (không load cả file vào RAM khi tải xuống).
tokio-util = { version = "0.7", features = ["io"] }
tower-http = { version = "0.6", features = ["cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
open = "5"
ffmpeg-sidecar = "2.7.0"
fontdb = "0.24.0"

[profile.release]
opt-level = 2
